# Include in the HTTPS server block matching publicUrl's hostname.
# Keep the trailing slash redirect and proxy routes together.
location = /wechat-connect { return 302 /wechat-connect/; }
location ^~ /wechat-connect/ {
    proxy_pass http://127.0.0.1:8318;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    client_max_body_size 20k;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}
